    <main>

      <section class="view" id="view-calendar" hidden></section>
      <section class="view" id="view-focus" hidden></section>
      <section class="view" id="view-habits" hidden></section>
      <section class="view" id="view-goals" hidden></section>
      <section class="view" id="view-achievements" hidden></section>

<!-- Task composer -->
<div class="overlay" id="taskFormOverlay" hidden>
  <div class="drawer" id="taskFormDrawer" role="dialog" aria-modal="true" aria-labelledby="taskFormHeading">
    <div class="drawer-header">
      <h2 id="taskFormHeading">New Task</h2>
      <button class="drawer-close" id="taskFormClose" aria-label="Close"><span class="icn icn-md" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span></button>
    </div>
    <form id="taskForm">
      <input type="hidden" id="taskFormId">
      <div class="field field-mb">
        <label for="taskTitleInput">Task title <span class="req-mark">*</span></label>
        <input type="text" id="taskTitleInput" required maxlength="140" placeholder="e.g. Revise Unit 1 notes">
      </div>
      <div class="field field-mb">
        <label for="taskDescInput">Description</label>
        <textarea id="taskDescInput" rows="2" placeholder="Optional details"></textarea>
      </div>
      <div class="field-row field-mb">
        <div class="field">
          <label for="taskCategorySelect">Category <span class="req-mark">*</span></label>
          <select id="taskCategorySelect" required></select>
        </div>
        <div class="field">
          <label for="taskPrioritySelect">Priority <span class="req-mark">*</span></label>
          <select id="taskPrioritySelect" required>
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
            <option value="URGENT">Urgent</option>
          </select>
        </div>
      </div>
      <div class="field-row field-mb">
        <div class="field">
          <label for="taskDueDate">Due date <span class="req-mark">*</span></label>
          <input type="date" id="taskDueDate" required>
        </div>
        <div class="field">
          <label for="taskDueTime">Due time <span class="req-mark">*</span></label>
          <input type="time" id="taskDueTime" required>
        </div>
      </div>
      <div class="field-row field-mb">
        <div class="field">
          <label for="taskEstDuration">Estimated duration (min)</label>
          <input type="number" id="taskEstDuration" min="0" step="5" placeholder="e.g. 45">
        </div>
        <div class="field">
          <label for="taskRecurringSelect">Recurring</label>
          <select id="taskRecurringSelect">
            <option value="">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
      </div>
      <div class="field field-mb">
        <label for="taskGoalSelect">Goal (optional)</label>
        <select id="taskGoalSelect"><option value="">No goal</option></select>
      </div>
      <div class="field field-mb">
        <label for="taskTagsInput">Tags</label>
        <input type="text" id="taskTagsInput" placeholder="college, deep-learning, urgent">
      </div>
      <div class="field field-mb-lg">
        <label>Subtasks</label>
        <div id="taskSubtasksBuilder"></div>
        <div class="subtask-add-row">
          <input type="text" id="newSubtaskInput" placeholder="Add a subtask">
          <button type="button" class="btn ghost" id="addSubtaskBtn">Add</button>
        </div>
      </div>
      <div id="taskFormError" class="detail-row form-error"></div>
      <button type="submit" class="btn primary btn-block" id="taskFormSubmit">+ Add Task</button>
    </form>
  </div>
</div>

<!-- Task details drawer -->
<div class="overlay" id="taskDetailsOverlay" hidden>
  <div class="drawer" id="taskDetailsDrawer" role="dialog" aria-modal="true" aria-label="Task details"></div>
</div>

<!-- Habit form -->
<div class="overlay center" id="habitFormOverlay" hidden>
  <div class="modal-box" id="habitFormBox" role="dialog" aria-modal="true" aria-label="New habit"></div>
</div>

<!-- Goal form -->
<div class="overlay center" id="goalFormOverlay" hidden>
  <div class="modal-box" id="goalFormBox" role="dialog" aria-modal="true" aria-label="New goal"></div>
</div>

<!-- Generic confirm -->
<div class="overlay center" id="confirmOverlay" hidden>
  <div class="modal-box" id="confirmBox" role="alertdialog" aria-modal="true"></div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="levelup-overlay" id="levelUpOverlay" hidden></div>
